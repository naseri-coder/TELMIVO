name: LIC-A9 Phase 2B isolated source tests
on:
  push:
    branches:
      - development/lic-a9-phase2a-crossrepo-contract-20261014
    paths:
      - .github/workflows/lic-a9-phase2b-once.yml

permissions:
  contents: read

jobs:
  product-license-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Identify source
        run: |
          git rev-parse HEAD
          sed -n '1,6p' go.mod
      - name: Execute offline fixture and source tests
        run: |
          python3 -B -m unittest discover -s tests/installationlicense -p 'test_contract_guard.py' -v
          python3 -B -m unittest discover -s tests/installationlicense -p 'test_fixture_source_integrity.py' -v
          python3 -B -m unittest discover -s tests/installationlicense -p 'test_go_toolchain_gate.py' -v
          python3 -B -m unittest discover -s tests/installationlicense -p 'test_source_preflight.py' -v
      - name: Install Go declared by product
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Compile and test real installation license Go package
        env:
          GOTOOLCHAIN: local
        run: |
          go version
          go test -count=1 -v ./internal/platform/installationlicense/...
