name: CI Web
on:
  push:
    branches: [feature/platform-bootstrap-v0.1, develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/miniapp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtl-smoke
          path: web/miniapp/test-results/

