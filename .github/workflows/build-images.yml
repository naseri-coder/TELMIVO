name: Build Images
on:
  push:
    branches: [feature/platform-bootstrap-v0.1, develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deployments/docker/backend.Dockerfile -t telmivo-backend:test .
      - run: docker build -f deployments/docker/miniapp.Dockerfile -t telmivo-miniapp:test .
      - run: docker run --rm --entrypoint ffmpeg telmivo-backend:test -version
      - run: cp .env.example .env && docker compose config --quiet
