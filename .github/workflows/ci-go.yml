name: CI Go
on:
  push:
    branches: [feature/r3-final-release-readiness-v0.1, feature/r3d-8-plugin-store-admin-hardening-v0.1, feature/r3d-7-commerce-broadcast-forms-v0.1, feature/r3d-6-automation-ai-v0.1, feature/r3d-5-ticketing-crm-v0.1, feature/r3d-4-access-file-manager-v0.1, feature/r3d-3-bot-factory-v0.1, feature/r3d-2-monetization-core-v0.1, feature/r3d-1-plugin-platform-v0.1, feature/r3c-downloader-bot-v0.1, feature/r3b-group-bot-v0.1, feature/r3a-main-miniapp-v0.1, feature/platform-bootstrap-v0.1, develop, main]
    paths-ignore: ['docs/**', '*.md', '.github/CODEOWNERS', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    branches: [feature/r3d-8-plugin-store-admin-hardening-v0.1, feature/r3d-7-commerce-broadcast-forms-v0.1, feature/r3d-6-automation-ai-v0.1, feature/r3d-5-ticketing-crm-v0.1, feature/r3d-4-access-file-manager-v0.1, feature/r3d-3-bot-factory-v0.1, feature/r3d-2-monetization-core-v0.1, feature/r3d-1-plugin-platform-v0.1, feature/r3c-downloader-bot-v0.1, feature/r3b-group-bot-v0.1,feature/r3a-main-miniapp-v0.1, feature/platform-bootstrap-v0.1, develop, main]
    paths-ignore: ['docs/**', '*.md', '.github/CODEOWNERS', '.github/ISSUE_TEMPLATE/**']
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go format gate
        run: |
          files="$(gofmt -l cmd internal db tests)"
          if [ -n "$files" ]; then
            printf 'gofmt required for:\n%s\n' "$files"
            gofmt -d $files
            exit 1
          fi
      - run: go vet ./...
      - name: Install media validation dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go test -race ./internal/... ./tests/contract -count=1
      - run: go build ./cmd/...
  native:
    uses: ./.github/workflows/migration-check.yml
