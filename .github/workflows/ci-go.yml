name: CI Go
on:
  push:
    branches: [feature/r3a-main-miniapp-v0.1, feature/platform-bootstrap-v0.1, develop, main]
    paths-ignore: ['docs/**', '*.md', '.github/CODEOWNERS', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    branches: [feature/platform-bootstrap-v0.1, develop, main]
    paths-ignore: ['docs/**', '*.md', '.github/CODEOWNERS', '.github/ISSUE_TEMPLATE/**']
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal db tests)"
      - run: go vet ./...
      - run: go test -race ./internal/... ./tests/contract -count=1
      - run: go build ./cmd/...
  native:
    uses: ./.github/workflows/migration-check.yml
